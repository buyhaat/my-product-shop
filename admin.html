<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f8fafc;
    }

    .admin-page {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .admin-header {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .admin-header h1 {
      font-size: 25px;
      margin-bottom: 3px;
    }

    .admin-header p {
      color: #6b7280;
      font-size: 14px;
    }

    .logout-btn {
      border: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 15px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-box > p {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .login-form-group {
      margin-bottom: 16px;
    }

    .login-form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .login-form-group input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:disabled {
      background: #9ca3af;
    }

    .login-message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .login-message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .admin-tab {
      border: 1px solid #e5e7eb;
      background: #fff;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .admin-tab.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .admin-section {
      display: none;
    }

    .admin-section.active {
      display: block;
    }

    .section-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-card h2 {
      margin-bottom: 15px;
      font-size: 21px;
    }

    .orders-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid #e5e7eb;
      background: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .filter-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      background: #dc2626;
      color: #fff;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 5px;
    }

    .orders-list {
      display: grid;
      gap: 14px;
    }

    .order-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .order-id {
      font-weight: 800;
      font-size: 16px;
    }

    .order-status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .order-status.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .order-status.completed {
      background: #dcfce7;
      color: #166534;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px 20px;
      color: #4b5563;
      font-size: 14px;
    }

    .order-details strong {
      color: #111827;
    }

    .complete-btn {
      margin-top: 14px;
      border: none;
      background: #16a34a;
      color: #fff;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .complete-btn:disabled {
      background: #9ca3af;
    }

    .products-admin-list {
      display: grid;
      gap: 12px;
    }

    .admin-product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .admin-product-info h3 {
      margin-bottom: 4px;
    }

    .admin-product-info p {
      color: #6b7280;
      font-size: 13px;
    }

    .stock-summary {
      font-size: 13px;
      color: #4b5563;
      text-align: right;
    }

    .admin-empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .admin-page {
        padding: 18px 12px 40px;
      }

      .admin-header {
        padding: 16px;
      }

      .admin-header h1 {
        font-size: 21px;
      }

      .admin-tabs {
        overflow-x: auto;
      }

      .admin-tab {
        white-space: nowrap;
      }

      .order-details {
        grid-template-columns: 1fr;
      }

      .admin-product {
        align-items: flex-start;
        flex-direction: column;
      }

      .stock-summary {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="loginPage" class="login-wrapper">

    <div class="login-box">

      <h1>Admin Login</h1>

      <p>আপনার Admin account দিয়ে Login করুন</p>

      <form id="loginForm">

        <div class="login-form-group">
          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Admin email"
            required
          >
        </div>

        <div class="login-form-group">
          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          >
        </div>

        <button
          type="submit"
          id="loginButton"
          class="login-btn"
        >
          Login
        </button>

        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </form>

    </div>

  </div>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <div id="dashboard" class="dashboard">

    <div class="admin-page">

      <header class="admin-header">

        <div>
          <h1>Admin Dashboard</h1>

          <p id="adminEmail">
            Admin
          </p>
        </div>

        <button
          id="logoutButton"
          class="logout-btn"
        >
          Logout
        </button>

      </header>


      <!-- TABS -->

      <div class="admin-tabs">

        <button
          class="admin-tab active"
          data-tab="ordersSection"
        >
          Orders
        </button>

        <button
          class="admin-tab"
          data-tab="productsSection"
        >
          Products
        </button>

      </div>


      <!-- =========================
           ORDERS
      ========================== -->

      <section
        id="ordersSection"
        class="admin-section active"
      >

        <div class="section-card">

          <h2>Orders</h2>

          <div class="orders-toolbar">

            <div class="filter-buttons">

              <button
                class="filter-btn active"
                data-filter="all"
              >
                All
              </button>

              <button
                class="filter-btn"
                data-filter="pending"
              >
                Pending

                <span
                  id="pendingCount"
                  class="pending-badge"
                >
                  0
                </span>

              </button>

              <button
                class="filter-btn"
                data-filter="completed"
              >
                Completed
              </button>

            </div>

            <button
              id="refreshOrders"
              class="filter-btn"
            >
              Refresh
            </button>

          </div>

          <div
            id="ordersList"
            class="orders-list"
          >
            <div class="admin-empty">
              Orders লোড হচ্ছে...
            </div>
          </div>

        </div>

      </section>


      <!-- =========================
           PRODUCTS
      ========================== -->

      <section
        id="productsSection"
        class="admin-section"
      >

        <div class="section-card">

          <h2>Products & Stock</h2>

          <div
            id="adminProductsList"
            class="products-admin-list"
          >
            <div class="admin-empty">
              Products লোড হচ্ছে...
            </div>
          </div>

        </div>

      </section>

    </div>

  </div>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="admin.js"></script>

</body>
</html>
