<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - My Shop</title>
  <meta name="description" content="My Shop Product Details">

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f7f7f7;color:#222}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .header{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid #eee}
    .back-button{width:42px;height:42px;border:0;border-radius:50%;background:#f1f1f1;font-size:22px}
    .header-title{margin-left:12px;font-size:18px;font-weight:700}
    .container{width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 50px}
    .loading{min-height:400px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#777}
    .loading-icon{font-size:38px;margin-bottom:10px}
    .error-box{display:none;text-align:center;background:#fff;border-radius:14px;padding:50px 20px;margin-top:30px}
    .error-icon{font-size:45px;margin-bottom:12px}.error-box h2{margin:0 0 8px}.error-box p{color:#777}
    .home-button{border:0;background:#111;color:#fff;padding:12px 20px;border-radius:8px;margin-top:10px}
    .product-page{display:none}
    .product-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;background:#fff;border-radius:16px;padding:20px}
    .gallery{width:100%}
    .main-image-wrap{width:100%;aspect-ratio:1/1;background:#f4f4f4;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .main-image{width:100%;height:100%;object-fit:contain;display:block}
    .no-image{font-size:55px;color:#aaa}
    .thumbnail-list{display:flex;gap:10px;overflow-x:auto;padding-top:12px}
    .thumbnail{width:70px;height:70px;flex:0 0 auto;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#f3f3f3;padding:0}
    .thumbnail.active{border-color:#111}.thumbnail img{width:100%;height:100%;object-fit:cover}
    .product-info{padding:5px 0}.product-name{font-size:28px;line-height:1.3;margin:0 0 12px;font-weight:700}
    .price-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .sale-price{font-size:26px;font-weight:700}.regular-price{color:#999;font-size:17px;text-decoration:line-through}
    .discount-badge{display:none;background:#111;color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700}
    .stock-status{display:inline-block;padding:6px 10px;border-radius:6px;background:#eaf7ea;color:#168316;font-size:14px;margin-bottom:18px}
    .stock-status.out{background:#ffecec;color:#d60000}
    .description-title{font-size:18px;margin:18px 0 8px}.description{color:#555;line-height:1.7;white-space:pre-line}
    .option-section{margin-top:20px}.option-title{font-size:16px;font-weight:700;margin-bottom:10px}
    .option-list{display:flex;gap:8px;flex-wrap:wrap}
    .option-button{min-width:50px;padding:9px 14px;border:1px solid #ccc;background:#fff;border-radius:7px;transition:.2s}
    .option-button:hover{border-color:#111}.option-button.selected{background:#111;color:#fff;border-color:#111}
    .option-button.disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
    .quantity-section{margin-top:22px}.quantity-control{display:flex;align-items:center;width:max-content;border:1px solid #ddd;border-radius:8px;overflow:hidden}
    .quantity-button{width:42px;height:42px;border:0;background:#f4f4f4;font-size:20px}.quantity-value{width:48px;text-align:center;font-weight:700}
    .total-box{margin-top:20px;padding:14px;border-radius:9px;background:#f7f7f7;display:flex;justify-content:space-between;align-items:center}
    .total-label{color:#666}.total-price{font-size:22px;font-weight:700}
    .order-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:9px;background:#111;color:#fff;font-size:17px;font-weight:700}
    .order-button:disabled{opacity:.45;cursor:not-allowed}
    .share-buttons{display:flex;gap:10px;margin-top:12px}.share-button{flex:1;padding:11px;border:1px solid #ddd;background:#fff;border-radius:8px;font-size:14px}
    .order-section{display:none;margin-top:20px;background:#fff;border-radius:16px;padding:20px}.order-section h2{margin-top:0;font-size:21px}
    .form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
    .form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;outline:0;background:#fff}
    .form-group textarea{min-height:90px;resize:vertical}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#111}
    .payment-methods{display:flex;gap:10px;flex-wrap:wrap}.payment-option{flex:1;min-width:120px;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff;text-align:center;cursor:pointer}
    .payment-option.selected{border-color:#111;background:#f5f5f5}.payment-option input{display:none}.payment-info{display:none;margin-top:12px}
    .form-alert{display:none;padding:11px;margin-bottom:14px;border-radius:8px;font-size:14px}
    .form-alert.success{display:block;background:#eaf7ea;color:#167516}.form-alert.error{display:block;background:#ffecec;color:#c40000}
    @media(max-width:768px){
      .container{padding:12px 10px 40px}
      .product-layout{grid-template-columns:1fr;padding:12px;gap:20px}
      .product-name{font-size:23px}.sale-price{font-size:23px}
    }
  </style>
</head>

<body>
  <header class="header">
    <button type="button" class="back-button" onclick="goBack()" aria-label="Back">←</button>
    <div class="header-title">My Shop</div>
  </header>

  <main class="container">
    <div id="loading" class="loading">
      <div class="loading-icon">⏳</div>
      <div>পণ্যের তথ্য লোড হচ্ছে...</div>
    </div>

    <div id="errorBox" class="error-box">
      <div class="error-icon">😕</div>
      <h2>পণ্য পাওয়া যায়নি</h2>
      <p id="errorMessage">এই পণ্যটি আর পাওয়া যাচ্ছে না।</p>
      <button type="button" class="home-button" onclick="goHome()">হোম পেজে যান</button>
    </div>

    <section id="productPage" class="product-page">
      <div class="product-layout">

        <div class="gallery">
          <div class="main-image-wrap">
            <img id="mainProductImage" class="main-image" alt="Product" style="display:none;">
            <div id="noImage" class="no-image">📦</div>
          </div>
          <div id="thumbnailList" class="thumbnail-list"></div>
        </div>

        <div class="product-info">
          <h1 id="productName" class="product-name">Product</h1>

          <div class="price-area">
            <span id="salePrice" class="sale-price">৳0</span>
            <span id="regularPrice" class="regular-price" style="display:none;">৳0</span>
            <span id="discountBadge" class="discount-badge">SALE</span>
          </div>

          <div id="stockStatus" class="stock-status">স্টক আছে</div>

          <h3 class="description-title">পণ্যের বিবরণ</h3>
          <div id="productDescription" class="description"></div>

          <div id="variantSection" class="option-section" style="display:none;">
            <div class="option-title">ভ্যারিয়েন্ট</div>
            <div id="variantList" class="option-list"></div>
          </div>

          <div id="sizeSection" class="option-section" style="display:none;">
            <div class="option-title">সাইজ</div>
            <div id="sizeList" class="option-list"></div>
          </div>

          <div id="quantitySection" class="quantity-section">
            <div class="option-title">পরিমাণ</div>
            <div class="quantity-control">
              <button type="button" class="quantity-button" onclick="decreaseQuantity()">−</button>
              <div id="quantityValue" class="quantity-value">1</div>
              <button type="button" class="quantity-button" onclick="increaseQuantity()">+</button>
            </div>
          </div>

          <div class="total-box">
            <span class="total-label">মোট:</span>
            <span id="totalPrice" class="total-price">৳0</span>
          </div>

          <button id="orderButton" type="button" class="order-button" onclick="showOrderForm()" disabled>
            Order Now
          </button>

          <div class="share-buttons">
            <button type="button" class="share-button" onclick="shareProduct()">Share Product</button>
            <button type="button" class="share-button" onclick="copyProductLink()">Copy Link</button>
          </div>
        </div>
      </div>

      <section id="orderSection" class="order-section">
        <h2>অর্ডারের তথ্য</h2>

        <div id="formAlert" class="form-alert"></div>

        <div class="form-group">
          <label>নাম</label>
          <input id="customerName" type="text" placeholder="আপনার নাম" autocomplete="name">
        </div>

        <div class="form-group">
          <label>মোবাইল নম্বর</label>
          <input id="customerPhone" type="tel" placeholder="01XXXXXXXXX" autocomplete="tel">
        </div>

        <div class="form-group">
          <label>ঠিকানা</label>
          <textarea id="customerAddress" placeholder="আপনার সম্পূর্ণ ঠিকানা"></textarea>
        </div>

        <div class="form-group">
          <label>জেলা</label>
          <input id="customerDistrict" type="text" placeholder="জেলা">
        </div>

        <div class="form-group">
          <label>উপজেলা</label>
          <input id="customerUpazila" type="text" placeholder="উপজেলা">
        </div>

        <div class="form-group">
          <label>পেমেন্ট পদ্ধতি</label>
          <div id="paymentMethods" class="payment-methods"></div>
        </div>

        <div id="paymentInfo" class="payment-info">
          <div class="form-group">
            <label>পেমেন্ট অ্যাকাউন্ট</label>
            <input id="paymentAccount" type="text" placeholder="যে নম্বর থেকে পেমেন্ট করেছেন">
          </div>

          <div class="form-group">
            <label>Transaction ID</label>
            <input id="transactionId" type="text" placeholder="Transaction ID">
          </div>
        </div>

        <button id="submitOrderButton" type="button" class="order-button" onclick="submitOrder()">
          অর্ডার কনফার্ম করুন
        </button>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="product.js"></script>
</body>
</html>
